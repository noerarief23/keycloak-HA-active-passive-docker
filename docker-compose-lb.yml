version: '3.8'

services:
  haproxy:
    image: haproxy:3.3.2-alpine
    container_name: haproxy-lb
    hostname: haproxy-lb
    
    # For multi-server deployment, use bridge network with extra_hosts
    # For single-server deployment, join Keycloak networks
    networks:
      - haproxy-network
      - keycloak-network-primary  # Join primary network
      - keycloak-network-replica  # Join replica network
    
    # Environment variables for stats authentication
    environment:
      - HAPROXY_STATS_USER=${HAPROXY_STATS_USER:-admin}
      - HAPROXY_STATS_PASSWORD=${HAPROXY_STATS_PASSWORD:-changeme_secure_password}
      - PRIMARY_SERVER_IP=${PRIMARY_BACKEND_IP}
      - REPLICA_SERVER_IP=${REPLICA_BACKEND_IP}
      - PRIMARY_KEYCLOAK_PORT=${PRIMARY_KEYCLOAK_PORT:-8080}
      - REPLICA_KEYCLOAK_PORT=${REPLICA_KEYCLOAK_PORT:-8081}
      - PRIMARY_KEYCLOAK_MGMT_PORT=${PRIMARY_KEYCLOAK_MGMT_PORT:-9000}
      - REPLICA_KEYCLOAK_MGMT_PORT=${REPLICA_KEYCLOAK_MGMT_PORT:-9001}
      - PRIMARY_POSTGRES_PORT=${PRIMARY_POSTGRES_PORT:-5432}
      - REPLICA_POSTGRES_PORT=${REPLICA_POSTGRES_PORT:-5433}
      - HAPROXY_EXTERNAL_HTTPS_PORT=${HAPROXY_HTTPS_PORT:-443}
    
    # Volume mounts
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.template:ro
      - ./haproxy/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./haproxy/certs:/etc/haproxy/certs:ro
      - ./haproxy/errors:/etc/haproxy/errors:ro
      - haproxy-socket:/var/run
    
    # Custom entrypoint to process environment variables
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    command: ["-W", "-db"]
    
    # Ports for multi-server deployment
    ports:
      - "${HAPROXY_HTTP_PORT:-80}:80"       # HTTP
      - "${HAPROXY_HTTPS_PORT:-443}:443"     # HTTPS
      - "${HAPROXY_POSTGRES_PORT:-5432}:5432"   # PostgreSQL
      - "${HAPROXY_STATS_PORT:-8404}:8404"   # Stats
    
    # Extra hosts for multi-server deployment
    # Map backend server hostnames to their IP addresses
    extra_hosts:
      - "keycloak-primary:${PRIMARY_BACKEND_IP}"
      - "keycloak-replica:${REPLICA_BACKEND_IP}"
      - "postgres-primary:${PRIMARY_BACKEND_IP}"
      - "postgres-replica:${REPLICA_BACKEND_IP}"
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /tmp/haproxy.cfg || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  haproxy-network:
    driver: bridge
  keycloak-network-primary:
    external: true
    name: keycloak-network-primary
  keycloak-network-replica:
    external: true
    name: keycloak-network-replica

volumes:
  haproxy-socket:
    driver: local

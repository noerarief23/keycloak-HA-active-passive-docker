version: '3.8'

services:
  haproxy:
    image: haproxy:2.9-alpine
    container_name: haproxy-lb
    hostname: haproxy-lb
    
    # For multi-server deployment, use bridge network with extra_hosts
    # For single-server deployment, can use host network mode
    networks:
      - haproxy-network
    
    # Environment variables for stats authentication and backend server IPs
    environment:
      - HAPROXY_STATS_USER=${HAPROXY_STATS_USER:-admin}
      # HAPROXY_STATS_PASSWORD must be set explicitly in the environment; no default is provided for security reasons
      - HAPROXY_STATS_PASSWORD=${HAPROXY_STATS_PASSWORD}
      # PRIMARY_SERVER_IP and REPLICA_SERVER_IP must be set in .env.lb file
      # These are used for extra_hosts configuration to resolve backend server hostnames
      - PRIMARY_SERVER_IP=${PRIMARY_SERVER_IP}
      - REPLICA_SERVER_IP=${REPLICA_SERVER_IP}
    
    # Volume mounts
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/etc/haproxy/certs:ro
      - ./haproxy/errors:/etc/haproxy/errors:ro
    
    # Ports for multi-server deployment
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "5432:5432"   # PostgreSQL
      - "8404:8404"   # Stats
    
    # Extra hosts for multi-server deployment
    # Map backend server hostnames to their IP addresses
    extra_hosts:
      - "keycloak-primary:${PRIMARY_SERVER_IP}"
      - "keycloak-replica:${REPLICA_SERVER_IP}"
      - "postgres-primary:${PRIMARY_SERVER_IP}"
      - "postgres-replica:${REPLICA_SERVER_IP}"
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  haproxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

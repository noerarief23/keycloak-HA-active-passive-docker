version: '3.8'

services:
  postgres-replica:
    image: postgres:15-alpine
    container_name: postgres-replica
    hostname: postgres-replica
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REPLICATION_PASSWORD=${REPLICATION_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - postgres-replica-archive:/var/lib/postgresql/archive
      - ./replica/postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./replica/postgres/config/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./replica/postgres/scripts/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh
    # Note: The replica will be initialized from the primary via base backup
    # The init-replica.sh script handles this process
    command: |
      bash -c "
      if [ ! -f /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
        /docker-entrypoint-initdb.d/init-replica.sh
      fi
      postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
      "
    networks:
      keycloak-network:
        ipv4_address: 172.20.0.20
    ports:
      - "5433:5432"
    # NOTE: The extra_hosts mapping is for cross-server deployments where the primary
    # PostgreSQL instance runs on a different physical host. PRIMARY_SERVER_IP must
    # point to the primary server's IP address. If testing locally with both primary
    # and replica on the same Docker host/network, this entry may conflict with
    # Docker's built-in DNS. For single-host testing, consider using a shared network
    # or removing this extra_hosts entry via docker-compose.override.yml.
    extra_hosts:
      - "postgres-primary:${PRIMARY_SERVER_IP}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-replica:
    build:
      context: ./common/keycloak
      dockerfile: Dockerfile
    image: keycloak-ha-replica:23.0
    container_name: keycloak-replica
    hostname: keycloak-replica
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-replica:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_HOSTNAME=${KC_HOSTNAME:-localhost}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    # Replica Keycloak is stopped by default
    # It should only be started after failover
    command: start --optimized
    depends_on:
      postgres-replica:
        condition: service_healthy
    networks:
      keycloak-network:
        ipv4_address: 172.20.0.21
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - manual  # Don't start automatically, use: docker compose --profile manual up

networks:
  keycloak-network:
    driver: bridge
    ipam:
      config:
        # NOTE: Both primary and replica use the same subnet (172.20.0.0/16).
        # This configuration assumes deployment on separate physical servers.
        # If running both on the same host for testing, there will be network
        # conflicts. For single-host testing, use different subnets (e.g.,
        # 172.21.0.0/16 for replica) or use a docker-compose.override.yml.
        - subnet: 172.20.0.0/16

volumes:
  postgres-replica-data:
    driver: local
  postgres-replica-archive:
    driver: local

version: '3.8'

services:
  postgres-primary:
    image: postgres:15-alpine
    container_name: postgres-primary
    hostname: postgres-primary
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
      - REPLICATION_PASSWORD=${REPLICATION_PASSWORD}
      - KEYCLOAK_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - postgres-primary-archive:/var/lib/postgresql/archive
      - ./primary/postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./primary/postgres/config/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./primary/postgres/scripts/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      keycloak-network:
        ipv4_address: 172.20.0.10
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-primary:
    build:
      context: ./primary/keycloak
      dockerfile: Dockerfile
    image: keycloak-ha:23.0
    container_name: keycloak-primary
    hostname: keycloak-primary
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-primary:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_HOSTNAME=${KC_HOSTNAME:-localhost}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    command: start --optimized
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      keycloak-network:
        ipv4_address: 172.20.0.11
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  keycloak-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-primary-data:
    driver: local
  postgres-primary-archive:
    driver: local

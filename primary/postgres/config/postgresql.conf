# PostgreSQL Primary Server Configuration
# For Streaming Replication

# Connection Settings
listen_addresses = '*'
max_connections = 100

# Write-Ahead Log (WAL) Settings - Required for Replication
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB
hot_standby = on

# Archiving (Optional but recommended for production)
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/archive/%f'

# Checkpoint Settings
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 1GB

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'all'
log_connections = on
log_disconnections = on

#---------------------------------------------------------------------
# HAProxy Configuration for Keycloak High Availability
# Version: 3.3.2
# Description: Load balancer for Keycloak and PostgreSQL with health checks
#---------------------------------------------------------------------

#---------------------------------------------------------------------
# Global settings
#---------------------------------------------------------------------
global
    # Logging configuration
    log stdout format raw local0 info
    
    # Maximum concurrent connections
    maxconn 4096
    
    # SSL/TLS default settings
    ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    
    # Runtime API socket (optional - commented out to avoid permission issues)
    # stats socket /tmp/haproxy.sock mode 660 level admin expose-fd listeners
    # stats timeout 30s
    
    # Performance tuning
    tune.ssl.default-dh-param 2048

#---------------------------------------------------------------------
# Default settings
#---------------------------------------------------------------------
defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  redispatch
    retries 3
    
    # Timeouts
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout http-keep-alive 10000ms
    timeout http-request 10000ms
    timeout queue 30000ms

#---------------------------------------------------------------------
# Frontend: HTTP (Port 80) - Redirect to HTTPS
#---------------------------------------------------------------------
frontend http_frontend
    bind *:80
    mode http
    
    # Capture client information
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    
    # Redirect all HTTP traffic to HTTPS
    http-request redirect scheme https code 301
    
    # Logging
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r"

#---------------------------------------------------------------------
# Frontend: HTTPS (Port 443) - Keycloak
#---------------------------------------------------------------------
frontend https_frontend
    bind *:443 ssl crt /etc/haproxy/certs/keycloak.pem alpn h2,http/1.1
    mode http
    
    # Capture client information and set proper forwarding headers for Keycloak
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Port ${HAPROXY_EXTERNAL_HTTPS_PORT}
    http-request set-header X-Forwarded-For %[src]
    
    # Security headers (remove X-Frame-Options to allow Keycloak iframes)
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response del-header X-Frame-Options
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"
    
    # Default backend
    default_backend keycloak_backend
    
    # Logging
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r"

#---------------------------------------------------------------------
# Frontend: PostgreSQL (Port 5432)
#---------------------------------------------------------------------
frontend postgres_frontend
    bind *:5432
    mode tcp
    
    # TCP logging
    option tcplog
    log-format "%ci:%cp [%t] %ft %b/%s %Tw/%Tc/%Tt %B %ts %ac/%fc/%bc/%sc/%rc %sq/%bq"
    
    # Timeouts for database connections
    timeout client 1h
    
    # Default backend
    default_backend postgres_backend

#---------------------------------------------------------------------
# Frontend: Statistics (Port 8404)
#---------------------------------------------------------------------
frontend stats_frontend
    bind *:8404
    mode http
    
    # Enable statistics
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    
    # Authentication (using environment variables)
    stats auth ${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}
    
    # Admin level access
    stats admin if TRUE
    
    # Prometheus metrics endpoint
    http-request use-service prometheus-exporter if { path /metrics }
    
    # Health check endpoint
    monitor-uri /health

#---------------------------------------------------------------------
# Backend: Keycloak
#---------------------------------------------------------------------
backend keycloak_backend
    mode http
    balance roundrobin
    
    # Health check configuration
    # Check Keycloak health endpoint on HTTP port (not management port)
    # Keycloak exposes /health/ready on both HTTP and management ports
    option httpchk
    http-check send meth GET uri /health/ready
    http-check expect status 200
    
    # Forwarding headers for Keycloak behind proxy
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Port ${HAPROXY_EXTERNAL_HTTPS_PORT}
    
    # Server definitions
    # Primary Keycloak (active by default)
    # Traffic goes to HTTP port, health check goes to management port
    server keycloak-primary ${PRIMARY_SERVER_IP}:${PRIMARY_KEYCLOAK_PORT} check inter 5s fall 3 rise 2 addr ${PRIMARY_SERVER_IP} port ${PRIMARY_KEYCLOAK_MGMT_PORT}
    
    # Replica Keycloak (backup, only used when primary is down)
    server keycloak-replica ${REPLICA_SERVER_IP}:${REPLICA_KEYCLOAK_PORT} check inter 5s fall 3 rise 2 backup addr ${REPLICA_SERVER_IP} port ${REPLICA_KEYCLOAK_MGMT_PORT}
    
    # Connection settings
    option http-server-close
    option forwardfor

#---------------------------------------------------------------------
# Backend: PostgreSQL
#---------------------------------------------------------------------
backend postgres_backend
    mode tcp
    balance roundrobin
    
    # PostgreSQL health check
    # Using TCP check instead of pgsql-check to avoid user requirement
    option tcp-check
    tcp-check connect
    
    # Server definitions
    # Primary PostgreSQL (read/write)
    # Use hostname that will be resolved via extra_hosts in docker-compose
    server postgres-primary ${PRIMARY_SERVER_IP}:${PRIMARY_POSTGRES_PORT} check inter 3s fall 3 rise 2
    
    # Replica PostgreSQL (read-only, backup)
    server postgres-replica ${REPLICA_SERVER_IP}:${REPLICA_POSTGRES_PORT} check inter 3s fall 3 rise 2 backup
    
    # Connection settings
    timeout server 1h

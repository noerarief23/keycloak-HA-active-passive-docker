# PostgreSQL Replica Server Configuration
# For Streaming Replication

# Connection Settings
listen_addresses = '*'
max_connections = 100

# Write-Ahead Log (WAL) Settings
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB

# Hot Standby Settings (Read-only queries on replica)
hot_standby = on
hot_standby_feedback = on

# Recovery Settings
# NOTE: The pg_basebackup -R flag will create primary_conninfo in postgresql.auto.conf
# with the replication password included automatically. The static configuration below
# is for reference only and intentionally omits the password parameter.
# PostgreSQL will use the value from postgresql.auto.conf created by pg_basebackup.
# primary_conninfo = 'host=postgres-primary port=5432 user=replicator application_name=replica'
primary_slot_name = 'replica_slot'
# promote_trigger_file is deprecated in PostgreSQL 12+, use pg_promote() function instead

# Archiving
# NOTE: The restore_command assumes that /var/lib/postgresql/archive/ on the replica
# contains the primary server's archived WAL files. Ensure that this path is backed
# by a shared/synchronized volume or that an external process (e.g., rsync, network
# mount, object storage sync) keeps it up to date with the primary's WAL archive.
# Without WAL synchronization, recovery that relies on archived WAL files will fail.
restore_command = 'cp /var/lib/postgresql/archive/%f %p'

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'all'
log_connections = on
log_disconnections = on

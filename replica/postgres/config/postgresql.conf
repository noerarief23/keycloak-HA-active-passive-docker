# PostgreSQL Replica Server Configuration
# For Streaming Replication

# Connection Settings
listen_addresses = '*'
max_connections = 100

# Write-Ahead Log (WAL) Settings
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB

# Hot Standby Settings (Read-only queries on replica)
hot_standby = on
hot_standby_feedback = on

# Recovery Settings
primary_conninfo = 'host=postgres-primary port=5432 user=replicator password=${REPLICATION_PASSWORD} application_name=replica'
primary_slot_name = 'replica_slot'
promote_trigger_file = '/tmp/promote_trigger'

# Archiving
restore_command = 'cp /var/lib/postgresql/archive/%f %p'

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'all'
log_connections = on
log_disconnections = on
